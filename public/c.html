<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control · Asfalto Salvaje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='16' width='52' height='32' rx='10' fill='%23ec3b40'/%3E%3Crect x='22' y='22' width='18' height='20' rx='4' fill='%231c2633'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #14121f; --panel: #1f1a33; --line: rgba(255,255,255,0.14); --text: #f4f1ff; --muted: #a9a3c4; --accent: #ffd23f; --c: #ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  #pad, #pad * { touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; -webkit-user-select: text; user-select: text; }
  .hidden { display: none !important; }

  /* ---------- unirse ---------- */
  #join { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; touch-action: auto; overflow: auto; }
  .join-card { width: min(420px, 100%); display: grid; gap: 14px; }
  .logo { font-family: 'Bungee', sans-serif; font-size: 34px; line-height: 1; text-align: center; text-shadow: 0 3px 0 #b32244; }
  .logo b { color: var(--accent); font-weight: 400; }
  label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; }
  .field { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); font-size: 22px; outline: none; }
  .field:focus { border-color: var(--accent); }
  #codeIn { font-family: 'Bungee', sans-serif; letter-spacing: 10px; text-transform: uppercase; text-align: center; font-size: 34px; }
  .big { font-family: 'Bungee', sans-serif; font-size: 24px; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(180deg, #ffe066, #ffb020); color: #2a1600; box-shadow: 0 5px 0 #b86b00; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b86b00; }
  .big:disabled { filter: grayscale(1); opacity: .5; }
  #joinErr { color: #ff6b7f; text-align: center; min-height: 1.3em; font-weight: 600; }
  .hint { color: var(--muted); text-align: center; font-size: 14px; }

  /* ---------- control ---------- */
  #pad { position: fixed; inset: 0; display: grid; background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--c) 32%, var(--bg)), var(--bg) 70%);
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap: 10px; grid-template-areas: "top top" "left right"; grid-template-columns: 1.25fr 1fr; grid-template-rows: auto 1fr; }
  .top { grid-area: top; display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .me-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 3px solid rgba(255,255,255,0.8); flex-shrink: 0; }
  .me-name { font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-score { margin-left: auto; font-family: 'Bungee', sans-serif; font-size: 18px; white-space: nowrap; }
  .me-score small { font-family: 'Rubik'; color: var(--muted); font-size: 13px; }
  .hearts { font-size: 18px; letter-spacing: 2px; }
  .steer { grid-area: left; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .act-wrap { grid-area: right; display: flex; align-items: center; justify-content: center; }
  .pbtn { border-radius: 22px; border: 3px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: clamp(44px, 12vmin, 90px); color: rgba(255,255,255,0.9); transition: background .06s, transform .06s; touch-action: none; }
  .pbtn.on { background: color-mix(in srgb, var(--c) 60%, transparent); border-color: var(--c); transform: scale(0.97); }
  #act { width: min(100%, 78vmin); aspect-ratio: 1; border-radius: 50%; font-size: clamp(56px, 22vmin, 130px); flex-direction: column; gap: 4px; }
  #act.has { background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 70%, #fff), color-mix(in srgb, var(--c) 70%, #000)); border-color: #fff; box-shadow: 0 0 40px color-mix(in srgb, var(--c) 60%, transparent); animation: glow 1.2s infinite; }
  #act .act-label { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
  @keyframes glow { 50% { box-shadow: 0 0 10px color-mix(in srgb, var(--c) 40%, transparent); } }

  @media (orientation: portrait) {
    #pad { grid-template-areas: "top top" "right right" "left left"; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 1.15fr; }
    #act { width: min(100%, 60vmin); }
  }

  /* ---------- paneles sobre el control ---------- */
  .sheet { position: fixed; inset: 0; display: flex; padding: 14px; background: rgba(14,11,26,0.9); backdrop-filter: blur(3px); touch-action: pan-y; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-card { width: min(560px, 100%); margin: auto; text-align: center; display: grid; gap: 10px; }
  .lob, .col { display: grid; gap: 10px; }
  @media (orientation: landscape) and (max-height: 600px) {
    .sheet-card:has(.lob.two) { width: min(860px, 100%); }
    .lob.two { grid-template-columns: 1fr 1.35fr; align-items: center; gap: 22px; }
    .col { gap: 7px; }
  }
  @media (max-height: 520px) { .sheet-card { gap: 7px; } .sheet h1 { font-size: 22px; } .sheet p { font-size: 15px; } .chip, .ghost { padding: 7px 12px; font-size: 15px; } .sheet .big { padding: 10px; font-size: 20px; } }
  .sheet h1 { font-family: 'Bungee', sans-serif; font-weight: 400; font-size: clamp(24px, 6vw, 34px); margin: 0; line-height: 1.15; }
  .sheet p { margin: 0; color: var(--muted); font-size: 17px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; font-size: 16px; }
  .chip.sel { border-color: var(--accent); background: rgba(255,210,63,0.15); }
  .sub { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .ghost { padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-weight: 600; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--c); vertical-align: -3px; margin-right: 6px; border: 2px solid #fff; }
  .banner { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; font-family: 'Bungee', sans-serif; font-size: clamp(26px, 7vmin, 44px); text-shadow: 0 3px 0 rgba(0,0,0,0.6); padding: 14px 22px; background: rgba(14,11,26,0.75); border-radius: 18px; max-width: 90vw; }
  .banner small { display: block; font-family: 'Rubik'; font-size: 16px; color: var(--muted); margin-top: 6px; text-shadow: none; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #b32244; padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 9; }
</style>
</head>
<body>

<div id="join">
  <form class="join-card" id="joinForm" autocomplete="off">
    <div class="logo">ASFALTO <b>SALVAJE</b></div>
    <div class="hint">Mirá el código en la pantalla grande</div>
    <label for="codeIn">Código de sala</label>
    <input id="codeIn" class="field" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
    <label for="nameIn">Tu nombre</label>
    <input id="nameIn" class="field" maxlength="12" spellcheck="false" placeholder="Piloto">
    <button class="big" id="joinBtn" type="submit">ENTRAR</button>
    <div id="joinErr"></div>
  </form>
</div>

<div id="pad" class="hidden">
  <div class="top">
    <span class="me-dot"></span>
    <span class="me-name" id="meName"></span>
    <span class="hearts" id="hearts"></span>
    <span class="me-score" id="meScore"></span>
  </div>
  <div class="steer">
    <div class="pbtn" id="left" data-zone="l">◀</div>
    <div class="pbtn" id="right" data-zone="r">▶</div>
  </div>
  <div class="act-wrap">
    <div class="pbtn" id="act" data-zone="f"><span id="actIcon">·</span><span class="act-label" id="actLabel">sin power-up</span></div>
  </div>
</div>

<div id="banner" class="banner hidden"></div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card" id="sheetBody"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="controller.js"></script>
</body>
</html>
